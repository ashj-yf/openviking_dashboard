[project]
name = "openviking-dashboard-backend"
version = "0.1.0"
description = "OpenViking multi-tenant management dashboard"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
    "cryptography>=44.0",
]

[tool.uv]
package = false
