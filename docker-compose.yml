services:
  dashboard:
    build: .
    image: openviking-dashboard:${TAG:-latest}
    env_file:
      - .env
    ports:
      # 前置反向代理时只绑回环；需要直连时改为 "8000:8000"
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
    restart: always
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
